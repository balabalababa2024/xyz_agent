id: vision_bridge
name: Vision Bridge (拍照问答 / 饮食热量)
version: 0.0.2
description: >-
  vision_analyze routes a host image / URL to an OpenAI-compatible vision
  endpoint (default Zhipu GLM-4V) and returns text. vision_diet_analyze only
  asks the model for food names + estimated grams, then computes calories locally
  from data/food_calories.json (the model never does arithmetic).
enabled: true
config_section: vision_bridge
config:
  base_url: https://open.bigmodel.cn/api/paas/v4
  model: glm-4v-flash
  max_tokens: 1024
  timeout_s: 90
  max_image_mb: 12
  max_output_chars: 8000
  media_dir: ""
  api_key: ""
secrets: [api_key]
settings:
  - { key: base_url, label: "Vision endpoint (OpenAI-compatible base URL)", type: string }
  - { key: model, label: "Vision model", type: string }
  - { key: max_image_mb, label: "Max image size (MB)", type: number }
  - { key: timeout_s, label: "Request timeout (s)", type: number }
  - { key: media_dir, label: "protoAgent media dir (empty = <box>/<instance>/media)", type: string }
  - { key: api_key, label: "Vision endpoint API key", type: secret }
capabilities:
  network: [open.bigmodel.cn]
  filesystem: read
